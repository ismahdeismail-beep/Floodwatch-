name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS — lint · typecheck · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build (apps & packages)
        run: npm run build -- --filter=@floodwatch/web --filter=@floodwatch/dashboard --filter=@floodwatch/admin

      - name: Mobile typecheck (Expo)
        working-directory: apps/mobile
        run: npx tsc --noEmit

  python:
    name: Python — services (compile + pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, auth, weather, hydrology, satellite, gis, ai, alerts, analytics]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install service requirements
        working-directory: services/${{ matrix.service }}
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-optional.txt || true

      - name: Compile check
        working-directory: services/${{ matrix.service }}
        run: python -m compileall app

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: python -m pytest tests -q

  docker:
    name: Docker — service images build
    runs-on: ubuntu-latest
    needs: [python]
    strategy:
      matrix:
        service: [api-gateway, auth, weather, hydrology, satellite, gis, ai, alerts, analytics]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        working-directory: services/${{ matrix.service }}
        run: docker build -t floodwatch/${{ matrix.service }}:ci .

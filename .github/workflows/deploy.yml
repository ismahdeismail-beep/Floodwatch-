name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [staging, production]
        default: staging
      image_tag:
        description: "Image tag to deploy (default: latest)"
        type: string
        default: latest
  push:
    tags: ["v*"]

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION || 'europe-west2' }}
  ARTIFACTORY_REPO: ${{ vars.ARTIFACTORY_REPO || 'floodwatch-services' }}

jobs:
  build-and-push:
    name: Build & push service images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, auth, weather, hydrology, satellite, gis, ai, alerts, analytics]
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker (Artifact Registry)
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Tag image
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "image_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=${{ inputs.image_tag || 'latest' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push
        working-directory: services/${{ matrix.service }}
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACTORY_REPO }}/${{ matrix.service }}"
          docker build -t "$IMAGE:${{ steps.tag.outputs.image_tag }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ steps.tag.outputs.image_tag }}"
          docker push "$IMAGE:latest"

  deploy:
    name: Deploy to ${{ inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy services (Terraform-style via gcloud run deploy)
        working-directory: services
        run: |
          ENV_NAME="${{ inputs.environment || 'staging' }}"
          TAG="${{ inputs.image_tag || 'latest' }}"
          for service in api-gateway auth weather hydrology satellite gis ai alerts analytics; do
            echo "==> Deploying $service ($TAG)"
            gcloud run deploy "floodwatch-$ENV_NAME-$service" \
              --image="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACTORY_REPO }}/$service:$TAG" \
              --platform=managed \
              --region="${{ env.GCP_REGION }}" \
              --allow-unauthenticated \
              --set-env-vars=ENVIRONMENT=$ENV_NAME
          done

      - name: Smoke test
        run: |
          pip install httpx
          python tests/smoke/smoke_services.py --base "https://api-${{ inputs.environment || 'staging' }}.floodwatch.ai"

  frontend:
    name: Deploy frontends (Vercel)
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy web
        working-directory: apps/web
        run: vercel --token ${{ secrets.VERCEL_TOKEN }} --yes ${{ (inputs.environment == 'production' || github.event_name == 'push') && '--prod' || '' }}

      - name: Deploy dashboard
        working-directory: apps/dashboard
        run: vercel --token ${{ secrets.VERCEL_TOKEN }} --yes ${{ (inputs.environment == 'production' || github.event_name == 'push') && '--prod' || '' }}

      - name: Deploy admin
        working-directory: apps/admin
        run: vercel --token ${{ secrets.VERCEL_TOKEN }} --yes ${{ (inputs.environment == 'production' || github.event_name == 'push') && '--prod' || '' }}

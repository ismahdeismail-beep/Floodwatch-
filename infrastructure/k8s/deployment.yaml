# Optional Kubernetes manifests — provided for teams that prefer GKE over
# Cloud Run. The deployment is Cloud-Run-style (stateless, 12-factor) and
# converts cleanly: container port, env, resources, health probes.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: floodwatch-ai
  namespace: floodwatch
  labels:
    app.kubernetes.io/name: floodwatch-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: floodwatch-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: floodwatch-ai
    spec:
      containers:
        - name: ai
          image: europe-west2-docker.pkg.dev/floodwatch-ai/floodwatch-services/ai:latest
          ports:
            - containerPort: 8006
          envFrom:
            - secretRef:
                name: floodwatch-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8006
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

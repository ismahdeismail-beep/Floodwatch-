global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "floodwatch-services"
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-gateway:8000
          - auth:8001
          - weather:8002
          - hydrology:8003
          - satellite:8004
          - gis:8005
          - ai:8006
          - alerts:8007
          - analytics:8008

  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "redis-exporter"
    static_configs:
      - targets: ["redis-exporter:9121"]

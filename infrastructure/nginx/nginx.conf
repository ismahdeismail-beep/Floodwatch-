# Optional dev reverse proxy — routes host names to service ports.
# Not required for local development (services expose their own ports).

events {}

http {
  upstream api_gateway { server api-gateway:8000; }
  upstream web_app     { server web:3000; }
  upstream dashboard   { server dashboard:3001; }
  upstream admin       { server admin:3002; }

  server {
    listen 80;
    server_name api.floodwatch.local;
    location / {
      proxy_pass http://api_gateway;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name floodwatch.local;
    location / { proxy_pass http://web_app; }
  }

  server {
    listen 80;
    server_name dashboard.floodwatch.local;
    location / { proxy_pass http://dashboard; }
  }

  server {
    listen 80;
    server_name admin.floodwatch.local;
    location / { proxy_pass http://admin; }
  }
}
